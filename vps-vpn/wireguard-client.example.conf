#   3. Rename this file to something like vps.conf, then in the WireGuard app
#      click "Add Tunnel -> Import tunnel(s) from file" and pick it.
#   4. AllowedIPs = 0.0.0.0/0 sends ALL your traffic through the VPS (full tunnel).
#      To only route DNS/not all traffic you would need a proxy - keep full tunnel.
